# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Gemini"

ai_usage_summary: |
  Conceptualized the Multiplicative Gates architecture and honeypot filters independently to mimic real-world HR screening logic. Used Gemini primarily as a pair-programmer to debug Python syntax issues, refactor the scoring functions for cleaner execution, and optimize the script to comfortably run within the 5-minute offline CPU limit. No candidate data was fed to any LLM during the offline ranking process.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Our solution is an offline, rule-based hybrid ranking system engineered to mimic an expert technical recruiter while strictly adhering to the CPU compute limits and zero-network constraints. We process candidate profiles by extracting and evaluating key dimensions: Title, Experience, Core Skills, Location, and Behavioral Signals. 

  To defeat "keyword-stuffer" traps and honeypots, we implemented an architecture based on 'Multiplicative Gates'. Instead of purely additive scoring, a candidate's base score is heavily penalized (multiplied by 0.05) if they possess non-technical titles (e.g., HR, Sales) or lack validated AI skills. Crucially, to bypass the lazy keyword stuffing trap, our skill parser only validates core AI skills (like Python, PyTorch, LLMs) if the candidate has utilized them for strictly more than 12 months. Finally, the total score is scaled by the recruiter response rate to ensure the shortlist only contains high-intent candidates.

